services:
  vpn:
    build: ./vpn
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "3000:3000"
    environment:
      VPN_USERNAME: ${VPN_USERNAME}
      VPN_PASSWORD: ${VPN_PASSWORD}
    healthcheck:
      test: ["CMD", "ping", "-c1", "-W3", "scolaritate.usv.ro"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    build: .
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${JWT_SECRET}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 64M

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: "service:vpn"
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
