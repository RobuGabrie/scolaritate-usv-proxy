name: Add casuta deploy key

on:
  workflow_dispatch:

jobs:
  add-key:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize the casuta-din-livezi deploy key on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOD2vl/G5HrYs/fjh/9LpogySSeGTtq8bXP3fogF+7Mu casuta-deploy"
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
            grep -qF "AAAAIOD2vl/G5HrYs/fjh/9LpogySSeGTtq8bXP3fogF+7Mu" ~/.ssh/authorized_keys || echo "$KEY" >> ~/.ssh/authorized_keys
            whoami
            grep -c "" ~/.ssh/authorized_keys
